<!DOCTYPE html>
<html lang="en">
    <script>
    // Navigation Guard Check
    (function checkSecurityCheckpoint() {
        const isAuth = sessionStorage.getItem("birthdayAuthenticated");
        if (isAuth !== "true") {
            // Redirect unauthorized users back to verification checkpoint
            window.location.href = "index.html";
        }
    })();
</script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Box Unboxing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background: radial-gradient(circle at center, #061c0f 0%, #020a05 60%, #000000 100%);
            color: #2ed173;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0,0,0,0.5) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            opacity: 0.3;
        }

        .card {
            background: rgba(4, 18, 10, 0.9);
            border: 1px solid #134e2a;
            box-shadow: 0 0 30px rgba(16, 120, 58, 0.25);
            border-radius: 8px;
            padding: 35px;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
            text-align: center;
        }

        /* 3D Box Container */
        .box-wrapper {
            perspective: 800px;
            margin: 30px auto;
            width: 140px;
            height: 140px;
            cursor: pointer;
        }

        .gift-box {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: floatBox 3s ease-in-out infinite;
        }

        @keyframes floatBox {
            0%, 100% { transform: translateY(0) rotateY(0deg); }
            50% { transform: translateY(-10px) rotateY(10deg); }
        }

        /* Box Mesh Styling */
        .box-face {
            position: absolute;
            width: 140px;
            height: 140px;
            background: rgba(9, 42, 21, 0.95);
            border: 2px solid #2ed173;
            box-shadow: inset 0 0 15px rgba(46, 209, 115, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #52f89d;
            border-radius: 6px;
        }

        .box-top {
            position: absolute;
            top: -15px;
            width: 150px;
            height: 30px;
            left: -5px;
            background: #185e32;
            border: 2px solid #3bf187;
            border-radius: 4px;
            transition: transform 0.8s ease;
            z-index: 5;
        }

        /* Opened State */
        .gift-box.opened .box-top {
            transform: translateY(-80px) rotate(-20deg);
            opacity: 0;
        }

        .gift-box.opened {
            animation: pulseGlow 1s forwards;
        }

        /* Content Reveal */
        .reveal-content {
            display: none;
            opacity: 0;
            transform: scale(0.9);
            animation: popIn 0.6s forwards 0.3s;
        }

        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }

        .tier-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 10px;
            border: 1px solid #2ed173;
            background: rgba(46, 209, 115, 0.1);
        }

        .box-number {
            font-size: 2.2rem;
            color: #52f89d;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(82, 248, 157, 0.5);
        }

        .clue-box {
            border: 1px dashed #1e703d;
            padding: 12px;
            margin: 15px 0;
            font-size: 0.85rem;
            color: #3bf187;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 4px;
        }

        button {
            background: #0f4021;
            color: #3bf187;
            border: 1px solid #1e703d;
            padding: 12px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
        }

        button:hover {
            background: #185e32;
            border-color: #2ed173;
            box-shadow: 0 0 12px rgba(46, 209, 115, 0.4);
            color: #ffffff;
        }

        .tap-instruction {
            font-size: 0.85rem;
            color: #1f9a53;
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div class="grid-overlay"></div>

    <div class="card">
        <!-- CLOSED GIFT STATE -->
        <div id="closedState">
            <div style="font-size: 0.9rem; color: #1f9a53; letter-spacing: 1px;">CLASSIFIED ITEM READY</div>
            <div class="box-wrapper" onclick="openBox()">
                <div class="gift-box" id="3dBox">
                    <div class="box-top"></div>
                    <div class="box-face">?</div>
                </div>
            </div>
            <div class="tap-instruction">[ TAP BOX TO UNWRAP ]</div>
        </div>

        <!-- REVEAL STATE -->
        <div id="revealState" class="reveal-content">
            <div class="tier-badge" id="tierBadge">CLEARANCE LEVEL: RARE</div>
            <p style="font-size: 0.9rem; color: #1f9a53;">RETRIEVE GIFT BOX:</p>
            <div class="box-number" id="drawnNumber">#--</div>

            <div class="clue-box" id="boxClue">
                Physical Gift Box ready for collection.
            </div>

            <button onclick="drawAnother()">CLAIM ANOTHER BOX</button>
            <button onclick="window.location.href='index.html'" style="background: transparent; border-color: #134e2a;">RETURN TO LETTER</button>
        </div>
    </div>

    <script src="audio.js"></script>
    <script>
        const drawnNum = sessionStorage.getItem('drawnBox') || Math.floor(Math.random() * 20) + 1;
        
        // Clearance Tiers mapping for fun pre-unboxing excitement
        const tiers = ['STANDARD CLEARANCE', 'RARE CLEARANCE', 'TOP SECRET', 'LEGENDARY ITEM'];
        
        // Optional custom hints/clues for each gift box number (1 to 20)
        const giftClues = {
            1: "Clue: Something soft to keep you cozy.",
            2: "Clue: Something sweet for your sweet tooth.",
            3: "Clue: Open me when you need a smile.",
            7: "Clue: Top Secret Special Gift!",
            10: "Clue: A memory worth keeping forever.",
            20: "Clue: The Grand Final Gift Box!"
        };

        function openBox() {
            playVictorySound();
            
            const box = document.getElementById('3dBox');
            box.classList.add('opened');

            // Set content details
            document.getElementById('drawnNumber').textContent = `BOX #${drawnNum}`;
            
            // Randomly assign clearance tier
            const tier = tiers[drawnNum % tiers.length];
            document.getElementById('tierBadge').textContent = `STATUS: ${tier}`;
            
            // Custom clue if exists
            if (giftClues[drawnNum]) {
                document.getElementById('boxClue').textContent = giftClues[drawnNum];
            } else {
                document.getElementById('boxClue').textContent = `Retrieve Box #${drawnNum} from the gift stash!`;
            }

            // Transition UI
            setTimeout(() => {
                document.getElementById('closedState').style.display = 'none';
                document.getElementById('revealState').style.display = 'block';
            }, 700);
        }

        function drawAnother() {
            playClickSound();
            window.location.href = 'games.html';
        }
    </script>
</body>
</html>
